# Lets `uv sync` install this repo's Python dependencies.

[project]
name = "demos-lang-marp"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "pyyaml",
]

[dependency-groups]
dev = [
    "mypy",
    "pylint",
    "pytest",
    "ruff",
    "types-PyYAML",
]

[tool.uv]
# Demo/teaching repo: not an installable package.
package = false

[tool.mypy]
mypy_path = "src:python:scripts"
explicit_package_bases = true
namespace_packages = true
