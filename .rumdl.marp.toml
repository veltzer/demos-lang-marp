# Markdown lint rules for Marp / Slidev slide decks (rsmultigit check same,
# shared across the slide repos). These files are slide source, not prose, and
# several rules fight the format:
#   MD041 - a deck opens with `---` YAML frontmatter, not a heading
#   MD029 - decks demonstrate ordered lists that start at a chosen number
#   MD057 - SVG/asset demos reference generated or deliberately-bogus paths
#   MD013 - slide source lines are not wrapped
#   MD014 - shell examples keep their "$" prompt on purpose, as the prose file explains
# It is otherwise the prose .rumdl.toml. Every rule not listed here still runs.

[global]
disable = ["MD014", "MD029", "MD041", "MD057"]

# MD033 (no-inline-html) is on, allowing only the elements Markdown has no
# syntax for and the fleet's pages need: Marp slide layouts (div), images
# sized or styled (img), charts and diagrams drawn in the page (script, svg,
# canvas), collapsible sections (details, summary), superscript (sup), and
# left-to-right runs inside Hebrew text (bdi). Any other element is reported.
[MD033]
allowed_elements = ["bdi", "canvas", "details", "div", "img", "script", "summary", "sup", "svg"]

[MD007]
indent = 4

[MD013]
line_length = 1000
