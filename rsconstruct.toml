# rsconstruct build configuration for this repository.

[build]
# src_dirs entries name directories; "." (the whole tree) is a config error
reject_dot_src_dirs = true

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.markdown]

[analyzer.python]

# ─── templating ──────────────────────────────────────────────────────────────

[processor.generator.tera]
src_dirs = ["tera.templates"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.checker.rumdl.prose]
src_dirs = ["doc"]
src_files = ["README.md"]
src_exclude_dirs = ["marp"]

# the slide decks are linted with the slide config (.rumdl.marp.toml), which
# also resolves links from the project root, where Marp addresses images from.
[processor.checker.rumdl.slides]
src_dirs = ["marp"]
args = ["--config", ".rumdl.marp.toml"]

[processor.checker.zspell]
src_dirs = ["marp"]

# ─── python ──────────────────────────────────────────────────────────────────

[processor.checker.ruff]
src_dirs = ["scripts", "config"]


[processor.checker.pyrefly]
src_dirs = ["scripts", "config"]

# ─── shell ───────────────────────────────────────────────────────────────────

[processor.checker.ishellcheck]
src_dirs = ["scripts", "config"]

# ─── lua ─────────────────────────────────────────────────────────────────────

[processor.checker.iluacheck]
src_dirs = ["config"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.checker.taplo]
src_files = [".ruff.toml", ".rumdl.marp.toml", ".rumdl.toml", "pyproject.toml", "rsconstruct.toml"]

[processor.checker.script.check_marp_md]
command = "scripts/check_marp_md.py"
# a Python script, which writes bytecode
required_tools = ["python"]
src_extensions = [".md"]
src_dirs = ["marp"]
batch = true
args = ["--fences", "--whitespace", "--links", "--labels"]

# ─── repo-specific configuration ────────────────────────────────────────────

# lint the GitHub Actions workflow files with actionlint
[processor.checker.iactionlint]
src_dirs = [".github/workflows"]

# audit the GitHub Actions workflow files for security problems with zizmor
# (policy: .github/zizmor.yml)
[processor.checker.zizmor]
src_dirs = [".github/workflows"]
# The pedantic persona: also the findings zizmor's default persona keeps
# quiet (undocumented permissions, template expansion of any context,
# unnamed jobs, ...). --offline and --no-progress are the default args.
args = ["--offline", "--no-progress", "--persona=pedantic"]

# ─── yaml ────────────────────────────────────────────────────────────────────

[processor.checker.iyamllint]
src_dirs = [".github"]
src_files = ["text_labels.yaml", ".yamllint.yaml"]

# ─── json ────────────────────────────────────────────────────────────────────

[processor.checker.ijsonlint]
src_files = [".mmdc.config.json", "package-lock.json", "package.json"]

# ─── xml / svg ───────────────────────────────────────────────────────────────

[processor.checker.ixmllint]
# warnings fail too, not only fatal errors
strict = true
src_dirs = ["images"]

# ─── javascript ──────────────────────────────────────────────────────────────

[processor.checker.oxlint]
src_files = [".marprc.mjs"]
args = ["-c", ".oxlintrc.repo.json"]
dep_inputs = [".oxlintrc.repo.json"]
