# rsconstruct build configuration for this repository.

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.markdown]

[analyzer.python]

# ─── templating ──────────────────────────────────────────────────────────────

# Convention: tera configs are Lua (config/*.lua). Every dep_auto entry
# listed here must exist: rsconstruct rejects a missing one at config load.
# Repos still on config/*.py keep a dep_inputs override in their local
# overlay until converted.
[processor.tera]
dep_auto = [
	"config/project.lua",
	"config/personal.lua",
	"config/version.lua",
]
src_dirs = ["tera.templates"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.rumdl.prose]
src_dirs = ["doc"]
src_files = ["README.md"]
src_exclude_dirs = ["marp"]

# the slide decks are linted with the slide-dialect config (.rumdl.marp.toml),
# which turns off the rules the Marp format inherently violates.
[processor.rumdl.slides]
src_dirs = ["marp"]
args = ["--config", ".rumdl.marp.toml"]

[processor.zspell]
src_dirs = ["marp"]

# ─── python ──────────────────────────────────────────────────────────────────

[processor.ruff]
src_dirs = ["scripts", "config"]

[processor.pylint]
src_dirs = ["scripts", "config"]

[processor.mypy]
src_dirs = ["scripts", "config"]

# ─── shell ───────────────────────────────────────────────────────────────────

[processor.shellcheck]
src_dirs = ["scripts", "config"]

# ─── lua ─────────────────────────────────────────────────────────────────────

[processor.luacheck]
src_dirs = ["config"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.taplo]
src_dirs = ["."]

[processor.script.check_md]
command = "scripts/check_md.py"
src_extensions = [".md"]
src_dirs = ["marp"]
batch = true
args = ["--fences", "--whitespace", "--links", "--labels"]

# ─── repo-specific configuration ────────────────────────────────────────────

# lint the GitHub Actions workflow files with actionlint
[processor.actionlint]
src_dirs = [".github/workflows"]

# ─── yaml ────────────────────────────────────────────────────────────────────

[processor.yamllint]
src_files = ["text_labels.yaml"]

# ─── json ────────────────────────────────────────────────────────────────────

[processor.ijsonlint]
src_files = [".mmdc.config.json", "package.json"]

# ─── xml / svg ───────────────────────────────────────────────────────────────

[processor.xmllint]
src_dirs = ["images"]

# ─── javascript ──────────────────────────────────────────────────────────────

[processor.eslint]
src_files = [".marprc.mjs"]
args = ["-c", ".eslint.config.js"]
