# rsconstruct build configuration for this repository.

[build]
# src_dirs entries name directories; "." (the whole tree) is a config error
reject_dot_src_dirs = true

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.markdown]

[analyzer.python]

# ─── templating ──────────────────────────────────────────────────────────────

# Convention: tera configs are Lua (config/*.lua). Every dep_auto entry
# listed here must exist: rsconstruct rejects a missing one at config load.
# Repos still on config/*.py keep a dep_inputs override in their local
# overlay until converted.
[processor.generator.tera]
dep_auto = [
	"config/project.lua",
	"config/personal.lua",
	"config/version.lua",
]
src_dirs = ["tera.templates"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.checker.rumdl.prose]
src_dirs = ["doc"]
src_files = ["README.md"]
src_exclude_dirs = ["marp"]

# the slide decks are linted with the slide-dialect config (.rumdl.marp.toml),
# which turns off the rules the Marp format inherently violates.
[processor.checker.rumdl.slides]
src_dirs = ["marp"]
args = ["--config", ".rumdl.marp.toml"]

[processor.checker.zspell]
src_dirs = ["marp"]

# ─── python ──────────────────────────────────────────────────────────────────

[processor.checker.ruff]
src_dirs = ["scripts", "config"]


[processor.checker.mypy]
src_dirs = ["scripts", "config"]

# ─── shell ───────────────────────────────────────────────────────────────────

[processor.checker.shellcheck]
src_dirs = ["scripts", "config"]

# ─── lua ─────────────────────────────────────────────────────────────────────

[processor.checker.luacheck]
src_dirs = ["config"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.checker.taplo]
src_files = [".rumdl.marp.toml", ".rumdl.toml", "pyproject.toml", "rsconstruct.toml"]

[processor.checker.script.check_marp_md]
command = "scripts/check_marp_md.py"
src_extensions = [".md"]
src_dirs = ["marp"]
batch = true
args = ["--fences", "--whitespace", "--links", "--labels"]

# ─── repo-specific configuration ────────────────────────────────────────────

# lint the GitHub Actions workflow files with actionlint
[processor.checker.actionlint]
src_dirs = [".github/workflows"]

# ─── yaml ────────────────────────────────────────────────────────────────────

[processor.checker.yamllint]
src_files = ["text_labels.yaml"]

# ─── json ────────────────────────────────────────────────────────────────────

[processor.checker.ijsonlint]
src_files = [".mmdc.config.json", "package.json"]

# ─── xml / svg ───────────────────────────────────────────────────────────────

[processor.checker.xmllint]
src_dirs = ["images"]

# ─── javascript ──────────────────────────────────────────────────────────────

[processor.checker.oxlint]
src_files = [".marprc.mjs"]
args = ["-c", ".oxlintrc.json"]
